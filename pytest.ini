[pytest]
minversion = 8.0
testpaths = tests
addopts =
    -ra
    --strict-markers
    --cov=BaseRescueAgent/src/BaseRescueAgent
    --cov-config=.coveragerc
    --cov-report=term-missing
    --cov-report=html:htmlcov
markers =
    unit: быстрые модульные тесты без запуска RCRS-симулятора
    integration: интеграционные тесты конфигов, моделей и runtime-логов
    load: нагрузочные и микропроизводительные тесты
    security: негативные, fault-injection и security-тесты
    offline: offline ML-contour tests: dataset builders, model wrappers, and training utilities
